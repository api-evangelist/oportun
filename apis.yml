aid: oportun
name: Oportun
description: 'Oportun (Nasdaq: OPRT) is a mission-driven financial services company and U.S. Treasury-certified
  Community Development Financial Institution (CDFI) that provides responsible, affordable personal loans,
  savings, and budgeting tools to people with limited or no credit history. Founded in 2006, Oportun has
  disbursed more than $20.8 billion across 7.7 million loans and established credit history for over 1.3
  million people. Beyond its consumer app, Oportun runs an Enterprise Platform offering Lending-as-a-Service
  (LaaS) and embedded-finance partnerships, but publishes no public developer portal, OpenAPI specification,
  SDKs, or self-serve API; the LaaS integration API is available only through contact-gated enterprise partnerships.'
